spring:
  application:
    name: club-manager
  datasource:
    url: jdbc:h2:file:../data/club-manager;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

app:
  jwt:
    secret: ${JWT_SECRET:Y2x1Yi1tYW5hZ2VyLWRldmVsb3BtZW50LXNlY3JldC1tdXN0LWNoYW5nZQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    password:
      min-length: ${ADMIN_PASSWORD_MIN_LENGTH:10}
    login-rate-limit:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-failures: ${LOGIN_RATE_LIMIT_MAX_FAILURES:5}
      window-minutes: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}
      storage: ${LOGIN_RATE_LIMIT_STORAGE:in-memory}
  audit:
    internal-api:
      enabled: ${AUDIT_INTERNAL_API_ENABLED:false}
      allowed-cidrs: ${AUDIT_INTERNAL_API_ALLOWED_CIDRS:}
      trusted-proxy-header: ${AUDIT_INTERNAL_API_TRUSTED_PROXY_HEADER:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@club-manager.local}
    app-url: ${APP_URL:http://localhost:5173}

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,metrics,loggers,info,prometheus
  zipkin:
    tracing:
      export:
        enabled: ${ZIPKIN_EXPORT_ENABLED:false}
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [traceId=%X{traceId}] [spanId=%X{spanId}] %logger{36} - %msg%n"
