spring:
  application:
    name: club-manager
  datasource:
    url: jdbc:h2:file:../data/club-manager;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:Y2x1Yi1tYW5hZ2VyLWRldmVsb3BtZW50LXNlY3JldC1tdXN0LWNoYW5nZQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  audit:
    internal-api:
      enabled: ${AUDIT_INTERNAL_API_ENABLED:false}
      allowed-cidrs: ${AUDIT_INTERNAL_API_ALLOWED_CIDRS:}
      trusted-proxy-header: ${AUDIT_INTERNAL_API_TRUSTED_PROXY_HEADER:}

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,metrics,loggers,info,prometheus
  zipkin:
    tracing:
      export:
        enabled: ${ZIPKIN_EXPORT_ENABLED:false}
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [traceId=%X{traceId}] [spanId=%X{spanId}] %logger{36} - %msg%n"
